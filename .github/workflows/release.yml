name: Release Assets

on:
  push:
    branches:
      - main
    paths:
      - 'datapacks/**'
      - 'resourcepacks/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create zips and checksums
        run: |
          # Create output directory
          mkdir -p output
          
          # Zip datapack if exists
          if [ -d "datapacks/CuteMetaDatapack" ]; then
            cd datapacks/CuteMetaDatapack
            zip -r ../../output/datapack.zip .
            cd ../..
          fi

          # Zip resourcepack if exists
          if [ -d "resourcepacks/CuteMetaResourcePack" ]; then
            cd resourcepacks/CuteMetaResourcePack
            zip -r ../../output/resourcepack.zip .
            cd ../..
          fi

          # Generate checksums
          cd output
          sha1sum * > checksums.txt
          cat checksums.txt

      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHECKSUMS=$(cat output/checksums.txt)
          NOTES="Automatically generated assets from the latest commit.\n\n### SHA-1 Checksums:\n\`\`\`\n$CHECKSUMS\n\`\`\`"
          
          # Delete existing release and tag if they exist
          gh release delete latest --cleanup-tag -y || true
          
          sleep 5
          
          # Create new release
          gh release create latest \
            --title "Latest Assets" \
            --notes "$NOTES" \
            --target main
            
          # Upload assets sequentially to avoid GitHub API concurrency 500 errors
          if [ -f "output/datapack.zip" ]; then
            gh release upload latest output/datapack.zip --clobber
          fi
          if [ -f "output/resourcepack.zip" ]; then
            gh release upload latest output/resourcepack.zip --clobber
          fi
          gh release upload latest output/checksums.txt --clobber
